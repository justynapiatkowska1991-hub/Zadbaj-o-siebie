<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Moja Chwila</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #faf7f5;
    color: #29272a;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.app {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 90px;
}

header {
    padding: 24px 22px 10px;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin-top: 8px;
    color: #888;
    font-size: 18px;
}

.screen {
    display: none;
    padding: 0 18px;
}

.screen.active {
    display: block;
}

.hero {
    background: linear-gradient(135deg, #f9e4e9, #f8ece9);
    border-radius: 30px;
    padding: 32px 28px;
    margin: 15px 0;
    box-shadow: 0 8px 30px rgba(100,70,80,.07);
}

.hero small {
    color: #9c5d74;
    font-weight: bold;
    font-size: 15px;
}

.hero h2 {
    font-size: 30px;
    line-height: 1.25;
    margin: 25px 0 18px;
}

.hero p {
    color: #777;
    font-size: 18px;
    line-height: 1.5;
}

.primary {
    width: 100%;
    border: none;
    border-radius: 20px;
    padding: 17px;
    background: #a35e77;
    color: white;
    font-size: 17px;
    font-weight: bold;
    margin-top: 15px;
}

.primary:active {
    transform: scale(.98);
}

.card {
    background: white;
    border-radius: 28px;
    padding: 25px;
    margin: 18px 0;
    box-shadow: 0 5px 25px rgba(0,0,0,.04);
}

.card h2 {
    margin-top: 0;
}

.moods {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.mood {
    border: none;
    background: #fbf8f6;
    border-radius: 18px;
    padding: 14px 5px;
    font-size: 27px;
}

.mood span {
    display: block;
    font-size: 12px;
    color: #888;
    margin-top: 7px;
}

.mood.selected {
    background: #f3dce3;
    box-shadow: inset 0 0 0 2px #a35e77;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 700px;
    margin: auto;
    height: 78px;
    background: rgba(255,255,255,.97);
    border-top: 1px solid #eee;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    z-index: 20;
}

.nav-btn {
    border: none;
    background: transparent;
    color: #aaa;
    font-size: 12px;
}

.nav-btn .icon {
    display: block;
    font-size: 27px;
    margin-bottom: 3px;
}

.nav-btn.active {
    color: #a35e77;
    font-weight: bold;
}

/* EMOCJE */

.mood-history {
    margin-top: 15px;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.history-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.history-emoji {
    font-size: 30px;
}

.empty {
    text-align: center;
    color: #999;
    padding: 30px 10px;
}

/* RELAKS */

.relax-options {
    display: grid;
    gap: 14px;
}

.relax-btn {
    border: none;
    background: #f8eeee;
    border-radius: 20px;
    padding: 20px;
    text-align: left;
    font-size: 16px;
}

.relax-btn strong {
    display: block;
    font-size: 18px;
    margin-bottom: 6px;
}

.relax-btn span {
    color: #888;
}

.breathing {
    text-align: center;
    padding: 15px 0;
}

.breath-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: #efd5df;
    margin: 25px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #7e4c60;
    transition: transform 4s ease-in-out;
}

.breath-circle.grow {
    transform: scale(1.35);
}

.timer {
    font-size: 42px;
    font-weight: bold;
    color: #9c5d74;
}

/* WYZWANIA */

.challenge {
    border: 1px solid #eee;
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 15px;
    background: #fff;
}

.challenge-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.challenge h3 {
    margin: 0 0 8px;
}

.challenge p {
    color: #888;
    margin-bottom: 15px;
}

.progress {
    height: 9px;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: #a35e77;
    width: 0%;
    transition: width .3s;
}

.check-btn {
    border: none;
    background: #f4e0e6;
    color: #9c5d74;
    border-radius: 14px;
    padding: 10px 14px;
    font-weight: bold;
}

/* PROFIL */

.profile-head {
    text-align: center;
    padding: 15px 0;
}

.avatar {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: #f2dce4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    margin: auto;
}

.profile-name {
    font-size: 25px;
    margin: 12px 0 5px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    background: #fbf8f6;
    border-radius: 18px;
    padding: 18px 5px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 24px;
    color: #9c5d74;
}

.stat span {
    font-size: 12px;
    color: #888;
}

.badges {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.badge {
    text-align: center;
    background: #fbf8f6;
    padding: 15px 5px;
    border-radius: 18px;
}

.badge .badge-icon {
    font-size: 32px;
}

.badge.locked {
    opacity: .35;
}

    width: 100%;
    padding: 16px;
    border: 1px solid #
